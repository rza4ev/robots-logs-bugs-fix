[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "uipath-error-agent"
version = "0.1.0"
description = "AI-powered UiPath error analysis agent"
requires-python = ">=3.11"

dependencies = [
    "pandas",
    "openpyxl",
    "pydantic",
    "python-dotenv",
    "qdrant-client",
    "sentence-transformers",
    "mistralai",
    "requests"


]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff"
]

[tool.setuptools.packages.find]
where = ["src"]